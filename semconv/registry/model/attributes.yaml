# Platform-owned attributes, one group per namespace. Every first segment
# here is on the registered-namespace list (policies/namespaces.rego).
groups:
- id: registry.api
  type: attribute_group
  display_name: api attributes
  brief: Platform attributes in the `api` namespace.
  attributes:
  - id: api.version
    type: string
    stability: development
    brief: The public API version a span served.
    examples:
    - example
