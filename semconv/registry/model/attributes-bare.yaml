# Single-segment keys: bounded labels on business metrics, diagnostic fields,
# and the keys the Temporal SDK adds to records. Declared, not namespaced.
groups:
- id: registry.platform.bare
  type: attribute_group
  display_name: Bare attributes
  brief: Single-segment keys the fleet writes. ADR-076 leaves them un-namespaced; they only have to be
    declared.
  attributes:
  - id: action
    type: string
    stability: development
    brief: Action on log, written by order.
    examples:
    - example
  - id: activity_type
    type: string
    stability: development
    brief: The Temporal activity type on an SDK metric.
    examples:
    - example
  - id: addr
    type: string
    stability: development
    brief: Addr on log, written by checkout, order, product.
    examples:
    - example
  - id: age
    type: int
    stability: development
    brief: Age on log, written by order.
    examples:
    - 1
  - id: attempt
    type: int
    stability: development
    brief: Attempt on log, written by checkout, order, payment.
    examples:
    - 1
  - id: attempts
    type: int
    stability: development
    brief: How many attempts a bounded retry made before giving up.
    examples:
    - 1
  - id: audience
    type: string
    stability: development
    brief: The JWT audience a verifier was configured with (startup record).
    examples:
    - example
  - id: batch
    type: int
