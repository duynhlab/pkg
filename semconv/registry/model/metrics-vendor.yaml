# Instruments that libraries the fleet runs emit under their own names (the
# Temporal Go SDK, pgxpool). Declared as they are; origin: vendor lets the
# unit rule accept the unit the library chose.
groups:
- id: metric.db.client.operation.errors
  type: metric
  metric_name: db.client.operation.errors
  instrument: counter
  unit: ''
  stability: development
  brief: Emitted by a library the fleet runs (db).
  attributes:
  - ref: db.system.name
  - ref: pgx.operation.type
  annotations:
    origin: vendor
