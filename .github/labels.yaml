# Declarative GitHub label configuration for duynhlab/pkg.
# Synced by .github/workflows/sync-labels.yml via EndBug/label-sync
# (delete-other-labels: true — this file is the whole label set).
# Ref: https://github.com/EndBug/label-sync#Config-files
#
# Usage: attach one primary area/* label per issue/PR (one per module;
# optional area/docs when the change also updates documentation).

# --- Triage / workflow ---

- name: bug
  description: Something isn't working
  color: '#e60000'
- name: enhancement
  description: New feature or request
  color: '#80e27e'
- name: documentation
  description: Improvements or additions to documentation
  color: '#0075ca'
- name: question
  description: Further information is requested
  color: '#c95dd4'
- name: help wanted
  description: Extra attention is needed
  color: '#00b894'
- name: good first issue
  description: Good for newcomers
  color: '#40a4ff'
- name: duplicate
  description: This issue or pull request already exists
  color: '#a0a0a0'
- name: invalid
  description: This doesn't seem right
  color: '#cccccc'
- name: wontfix
  description: This will not be worked on
  color: '#888888'
- name: dependencies
  description: Pull requests that update a dependency
  color: '#005cbf'
- name: github-actions
  description: Pull requests that update GitHub Actions workflows
  color: '#A3E89A'
- name: hold
  description: Issues and pull requests put on hold
  color: '#ff0000'
- name: blocked/upstream
  description: Blocked by an upstream dependency or issue
  color: '#ff5700'
- name: breaking-change
  description: Changes an exported API or behavior consumers depend on
  color: '#d93f0b'
- name: release
  description: Module tagging and release coordination
  color: '#ffd700'

# --- Area: Layer 0 modules (foundation, green tones) ---

- name: area/proto
  description: proto module — gRPC contracts and generated stubs
  color: '#00e54d'
- name: area/logger
  description: logger/zapx, logger/zerolog, logger/clog modules
  color: '#22c55e'
- name: area/flagx
  description: flagx module — startup-validated environment flags
  color: '#86efc9'

# --- Area: Layer 1 modules (building blocks, blue tones) ---

- name: area/httpx
  description: httpx module — HTTP error responses and pagination
  color: '#1673b6'
- name: area/grpcx
  description: grpcx module — gRPC server/client helpers and interceptors
  color: '#06b6d4'
- name: area/authmw
  description: authmw module — JWT middleware and JWKS verification
  color: '#0c8599'
- name: area/idempotency
  description: idempotency module — idempotency-key records and repository
  color: '#40a4ff'

# --- Area: Layer 2 modules (terminal, purple/orange tones) ---

- name: area/obsx
  description: obsx module — OpenTelemetry SDK bootstrap and profiling
  color: '#7c3aed'
- name: area/dbx
  description: dbx module — Postgres pool construction and instrumentation
  color: '#863faf'
- name: area/migratex
  description: migratex module — embedded SQL schema migrations
  color: '#c739ff'
- name: area/temporalx
  description: temporalx module — Temporal client/worker bootstrap
  color: '#f59e0b'

# --- Area: cross-cutting ---

- name: area/ci
  description: CI workflows, Makefile, and validation tooling
  color: '#f7cc45'
- name: area/docs
  description: Documentation related issues and pull requests
  color: '#0075ca'
