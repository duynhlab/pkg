name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # sonarqube.yml's job requests this; a reusable workflow can't exceed the caller's grant

jobs:
  # Multi-module gate through the shared go-check.yml: the Makefile fans
  # tidy/fmt/vet/lint/test out per module (so the reusable lint job, which
  # assumes a single root module, stays off), the git diff catches a PR
  # pushed without tidy/fmt, and make coverage merges the per-module
  # profiles into the coverage.out artifact sonarqube.yml expects.
  go-check:
    uses: duynhlab/gha-workflows/.github/workflows/go-check.yml@e78fca208b20d2a0106571a1e1ee3bf23829310c # main
    with:
      command-test: 'make test TAGS=integration && git diff --exit-code && make coverage'
      gomod-path: 'obsx/go.mod' # any module works: all pin the same go directive
      cache-dependency-path: '**/go.sum'
      lint: false # lint runs per module inside make test

  # Protobuf contract checks for the gRPC modules under proto/.
  # Lints the .proto style and fails the PR on a backward-incompatible change.
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          lint: true
          format: true
          breaking: true
          breaking_against: 'https://github.com/duynhlab/pkg.git#branch=main'
          # Don't post a PR comment: it needs pull-requests:write (and fails on
          # fork PRs). The lint/format/breaking checks still gate the PR.
          pr_comment: false

  sonar:
    needs: go-check
    uses: duynhlab/gha-workflows/.github/workflows/sonarqube.yml@812bbdb2b2138dec0a48b50fcdb3ef437aca870b # main
    with:
      project-key: 'duynhlab_pkg'
      organization: 'duynhlab'
      fail-on-quality-gate: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
