name: release

# Publish a GitHub Release whenever a module tag is pushed. Modules version
# independently: `make release-<module> VER=x.y.z` pushes <module>/vx.y.z
# (e.g. obsx/v0.36.0, logger/zapx/v0.36.0) and consumers pin that tag via
# `go get github.com/duynhlab/pkg/<module>@vx.y.z`. This gives each tag a
# release page with auto-generated notes. No build/artifacts — pkg is a Go
# library. The bare v*.*.* pattern keeps release pages working for the
# pre-split single-module tags.
on:
  push:
    tags:
      - "v*.*.*"
      - "**/v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
