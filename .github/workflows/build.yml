name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # sonarqube.yml's job requests this; a reusable workflow can't exceed the caller's grant

jobs:
  # Mirrors check.yml's go-check job: the multi-module gate runs through the
  # Makefile via the shared go-check.yml (lint per module inside make test).
  go-check:
    uses: duynhlab/gha-workflows/.github/workflows/go-check.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main # main
    with:
      command-test: 'make test TAGS=integration && git diff --exit-code && make coverage'
      gomod-path: 'obsx/go.mod' # any module works: all pin the same go directive
      cache-dependency-path: '**/go.sum'
      lint: false # lint runs per module inside make test

  sonar:
    needs: go-check
    uses: duynhlab/gha-workflows/.github/workflows/sonarqube.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main # main
    with:
      project-key: 'duynhlab_pkg'
      organization: 'duynhlab'
      fail-on-quality-gate: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
