syntax = "proto3";

package product.v1;

option go_package = "github.com/duynhlab/pkg/proto/product/v1;productv1";

// ProductService is the internal (east-west) contract for the product service.
// It is a READ contract: price and catalog answers for checkout.
//
// RFC-0021 phase 4 finished emptying this contract of stock. Removed, in order:
// the write operations (ReserveStock / ReleaseStock), then GetProducts and its
// ProductInfo — the last place product answered an availability question, via
// available_qty read from a column frozen at the write cutover.
//
// The expand → migrate → contract for that read completed as designed:
// BatchGetCurrentPrices was added as the price-only successor, checkout migrated
// to it plus inventory.v1/CheckAvailability, and only then did the predecessor
// go. Field numbers are not reused, and the messages go with the RPCs, so
// nothing can be silently rebound to a different meaning.
service ProductService {
  // BatchGetCurrentPrices is the price authority for checkout re-validation.
  // DB-truth — it bypasses the browsing cache. Read-only; the response omits
  // unknown SKUs rather than erroring, and carries NO availability: stock is
  // inventory.v1's answer.
  rpc BatchGetCurrentPrices(BatchGetCurrentPricesRequest) returns (BatchGetCurrentPricesResponse);
}

// --- RFC-0021: price-only checkout reads ---

// BatchGetCurrentPricesRequest asks for current prices by SKU. sku_id matches
// inventory.v1 identity (one product = one SKU initially, sku_id = product id).
message BatchGetCurrentPricesRequest {
  repeated string sku_ids = 1;
}

// CurrentPrice is the price-only view checkout validates against; it carries
// no stock fields by design.
message CurrentPrice {
  string sku_id = 1;
  // Display-name snapshot for session line items.
  string name = 2;
  // Current catalog unit price in int64 minor units (RFC-0010 P3), rounded
  // once at the product boundary.
  int64 price_minor = 3;
  // ISO-4217, e.g. "USD".
  string currency = 4;
  // False when the catalog no longer sells this SKU (unpublished/archived);
  // checkout fails validation on it just like a missing SKU.
  bool sellable = 5;
}

// BatchGetCurrentPricesResponse contains only the requested SKUs that exist;
// callers treat a missing SKU as "product gone" and fail their validation.
message BatchGetCurrentPricesResponse {
  repeated CurrentPrice prices = 1;
}
